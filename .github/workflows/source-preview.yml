name: Source preview checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked application package
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototype
      - name: Deterministic Node 24 suites
        run: npm run test:ci
        working-directory: prototype
      - name: Repository, expense and source boundary checks
        run: |
          python3 -m unittest discover -s expenses
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p 'test_*.py'
          python3 scripts/check-source-syntax.py
          python3 scripts/check-product-boundary.py
  browser:
    # Advisory: only validate is required by main's existing protection rule.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked application package
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: prototype
      - name: Install pinned browser CLI (CI only)
        run: npm install --global --ignore-scripts --no-audit --no-fund chrome-devtools-axi@0.1.39
      - name: Select browser for all behavioral checks
        run: |
          # Use stable Chrome for the process fixtures and browser passes.
          CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROMIUM"
          "$CHROMIUM" --version
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
      - name: Browser and real-process Node suites
        id: integration
        continue-on-error: true
        run: npm run test:integration
        working-directory: prototype
      - name: Chromium reload, retry, history and layout gate
        id: chromium
        continue-on-error: true
        run: npm run test:browser
        working-directory: prototype
      - name: Report advisory failures
        if: always()
        env:
          INTEGRATION: ${{ steps.integration.outcome }}
          CHROMIUM_GATE: ${{ steps.chromium.outcome }}
        run: test "$INTEGRATION" = success && test "$CHROMIUM_GATE" = success
